name: Package All Pinpoint 3.1.0 Images (arm64)

on:
  workflow_dispatch:

env:
  ARCHIVE_NAME: pinpoint-3.1.0-full-arm64-images.tar.gz

jobs:
  package-images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build missing Pinpoint ARM64 images
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch v3.1.0 https://github.com/pinpoint-apm/pinpoint.git pinpoint-source
          # The official 3.1.0 HBase Dockerfile uses an amd64-only OpenJDK image.
          # Keep the official scripts/config and replace only the base image.
          sed 's|openjdk:8u342-slim|eclipse-temurin:8-jre-jammy|g' \
            pinpoint-source/hbase/Dockerfile > pinpoint-source/hbase/Dockerfile.arm64
          docker buildx build --platform linux/arm64 --load \
            -f pinpoint-source/hbase/Dockerfile.arm64 \
            -t pinpointdocker/pinpoint-hbase:3.1.0 pinpoint-source/hbase

          # The official Agent Dockerfile is architecture-neutral; provide its
          # expected release archive and build it for ARM64.
          mkdir -p pinpoint-source/agent-module/agent/target
          curl -fL --retry 5 \
            https://github.com/pinpoint-apm/pinpoint/releases/download/v3.1.0/pinpoint-agent-3.1.0.tar.gz \
            -o pinpoint-source/agent-module/agent/target/pinpoint-agent-3.1.0.tar.gz
          docker buildx build --platform linux/arm64 --load \
            -t pinpointdocker/pinpoint-agent:3.1.0 pinpoint-source/agent-module/agent

      - name: Pull and verify ARM64 images
        shell: bash
        run: |
          set -Eeuo pipefail
          images=(
            pinpointdocker/pinpoint-web:3.1.0-metric
            pinpointdocker/pinpoint-collector:3.1.0-metric
            pinpointdocker/pinpoint-batch:3.1.0
            mysql:8.0
            zookeeper:3.4.13
            redis:7.0.14
            ubuntu/kafka:3.1-22.04_beta
            apachepinot/pinot:1.0.0-11-amazoncorretto
            zookeeper:3.8.0-temurin
            telegraf:1.25.0
          )
          for image in "${images[@]}"; do
            echo "Pulling linux/arm64: ${image}"
            if ! docker pull --platform linux/arm64 "${image}"; then
              echo "ERROR: ${image} does not provide a usable linux/arm64 image or registry access failed." >&2
              exit 1
            fi
            arch="$(docker image inspect --format '{{.Architecture}}' "${image}")"
            test "${arch}" = arm64 || { echo "ERROR: ${image} resolved to ${arch}, expected arm64" >&2; exit 1; }
          done
          for image in pinpointdocker/pinpoint-hbase:3.1.0 pinpointdocker/pinpoint-agent:3.1.0; do
            arch="$(docker image inspect --format '{{.Architecture}}' "${image}")"
            test "${arch}" = arm64 || { echo "ERROR: built ${image} is ${arch}, expected arm64" >&2; exit 1; }
          done

      - name: Export and compress images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker save \
            pinpointdocker/pinpoint-web:3.1.0-metric \
            pinpointdocker/pinpoint-collector:3.1.0-metric \
            pinpointdocker/pinpoint-hbase:3.1.0 \
            pinpointdocker/pinpoint-batch:3.1.0 \
            pinpointdocker/pinpoint-agent:3.1.0 \
            mysql:8.0 zookeeper:3.4.13 redis:7.0.14 \
            ubuntu/kafka:3.1-22.04_beta \
            apachepinot/pinot:1.0.0-11-amazoncorretto \
            zookeeper:3.8.0-temurin telegraf:1.25.0 \
            | gzip -1 > "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          ls -lh "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256"

      - name: Upload ARM64 image bundle
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-3.1.0-full-arm64-images
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 7
          compression-level: 0
